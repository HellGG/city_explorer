services:
  mariadb:
    image: mariadb:11
    container_name: mariadb-tw
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: city_explorer
      MARIADB_USER: web
      MARIADB_PASSWORD: web
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  mariadb-data:
